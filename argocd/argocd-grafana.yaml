apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 7.3.0
    helm:
      values: |
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Mimir
              type: prometheus
              url: http://mimir-service.monitoring.svc.cluster.local:8080/prometheus
              access: proxy
              isDefault: true
        ingress:
          enabled: true
          hosts:
            - grafana.13.212.10.28.nip.io
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
