apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gymflex-backend
  name: gymflex-backend-deployment
  namespace: gymflex
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gymflex-backend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gymflex-backend
      namespace: gymflex
    spec:
      containers:
        - image: noseyug/gymflex-backend:v48
          imagePullPolicy: Always
          name: gymflex-backend
          ports:
            - containerPort: 3002
              name: tcp
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: gymflex-backend-service
  namespace: gymflex
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: tcp
      port: 3002
      protocol: TCP
      targetPort: 3002
  selector:
    app: gymflex-backend
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gymflex-backend-ingress
  namespace: gymflex
spec:
  ingressClassName: nginx
  rules:
    - host: api-gymflex.noseyug.vn
      http:
        paths:
          - backend:
              service:
                name: gymflex-backend-service
                port:
                  number: 3002
            path: /
            pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gymflex-frontend
  name: gymflex-frontend-deployment
  namespace: gymflex
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gymflex-frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gymflex-frontend
      namespace: gymflex
    spec:
      containers:
        - image: noseyug/gymflex-frontend:v48
          imagePullPolicy: Always
          name: gymflex-frontend
          ports:
            - containerPort: 80
              name: tcp
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: gymflex-frontend-service
  namespace: gymflex
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: tcp
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: gymflex-frontend
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gymflex-frontend-ingress
  namespace: gymflex
spec:
  ingressClassName: nginx
  rules:
    #///- host: gymflex.noseyug.vn
    - http:
        paths:
          - backend:
              service:
                name: gymflex-frontend-service
                port:
                  number: 80
            path: /
            pathType: Prefix